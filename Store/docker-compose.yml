services:
  qdrant-node:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-engine
    ports:
      - '127.0.0.1:8093:6333'  # Host 8093 routes to Container 6333 REST
      - '127.0.0.1:8094:6334'  # Host 8094 routes to Container 6334 gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
    environment:
      - QDRANT__STORAGE__PERFORMANCE__eMAX_SEARCH_THREADS=2
      - QDRANT__VECTORS__MEMMAP_THRESHOLD=0
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
