# -----------------------------------------------------------------
# Declarative FastMCP Network SSE Server Configuration
# -----------------------------------------------------------------
servers:
  qdrant-srv:
    name: ai-rag-srv
    host: "http://win-host:8095/sse"
    port: 8095
    api_key: dev-srv-key-default

watchers:
  qdrant-wtr:
    name: ai-rag-wtr
    db: db-dev
    vault: 'D:\Obsidian\Vaults\v-dev'
    api_key: dev-wtr-key-default
